# Flexisip external-push-flexiapi 只接受 https(且用 HTTP/2)→ 本機自簽 TLS 反代到 push_router.py
server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    location = /api/push_notification {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8090/api/push_notification;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
    location / { return 404; }
}
