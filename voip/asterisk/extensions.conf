[from-internal]
; iPhone 撥電話:撥 9 開頭的外線
; baresip 只認自己(6001)的呼叫,所以 Dial 給 6001(它會接);
; 撥號前先 curl 告知膠水目標號碼,膠水收到 baresip 來電時叫 ofono 撥該號碼
exten => _9.,1,NoOp(iPhone 撥外線 ${EXTEN:1} via HFP bridge)
 same => n,System(curl -s "http://127.0.0.1:4455/?num=${EXTEN:1}")
 same => n,Dial(PJSIP/6001,60)
 same => n,Hangup()

; 直撥分機(6001/6002 互撥測試)
exten => _600X,1,NoOp(分機互撥 ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; baresip 手機來電進來 → 響 iPhone
exten => mobile-in,1,NoOp(手機來電 → 響 iPhone)
 same => n,Dial(PJSIP/6002,60)
 same => n,Hangup()

; 測試分機:Echo(把 baresip 送上來的音訊原樣回放,驗證 player+source 雙向與時脈)
exten => 600,1,NoOp(Echo test for baresip audio path)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
